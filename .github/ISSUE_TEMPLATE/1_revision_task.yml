name: Revision task
description: One piece of work owed to the referees or editor (a figure, table, check, or text change).
title: "[R1 1(a)] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        One issue per referee point (or sub-point) that needs code or data work. Put the comment number in the title, e.g. `[R1 1(a)] Triangulate exposure with Van Donkelaar and AQS`.
        Link each run you launch for this task back here by writing `Part of #<this issue>` in the run issue.
  - type: dropdown
    id: source
    attributes:
      label: Comment from
      options: ["Referee 1", "Referee 2", "Editor", "Our own check"]
    validations:
      required: true
  - type: input
    id: comment
    attributes:
      label: Comment number
      placeholder: "e.g. 1(a)"
  - type: input
    id: owner
    attributes:
      label: Responsible (as in the response file)
      placeholder: "e.g. LA/MT; LB can help"
  - type: textarea
    id: ask
    attributes:
      label: What the referee asks for (short)
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable and who gets it
      placeholder: "e.g. Appendix table of person- vs area-weighted exposure under 3 measures, csv + tex to MT"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: "e.g. Table in Overleaf appendix and response paragraph drafted"
  - type: textarea
    id: steps
    attributes:
      label: Steps
      value: |
        - [ ] 
